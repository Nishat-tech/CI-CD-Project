name: Deploy Backend

on: 
  push:
    branches:
      - main
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start Backend in Background
        run: npm run start &
        env:
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

      - name: Wait for Backend to start
        run: sleep 10

      - name: Test Backend Endpoint
        run: curl http://localhost:4000/health || echo "Server might not be ready yet"

      - name: Deploy Frontend
        run: npm run build  
        